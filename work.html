<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work – ALL GROUP DESIGN AND RESEARCH</title>
    <link rel="stylesheet" href="/site/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .work-page-content {
            padding: 5rem;
            max-width: 1400px;
        }

        .category-group {
            margin-bottom: 4rem;
        }

        .category-name {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 3rem;
            list-style: none;
            padding: 0;
        }

        .project-item {
            margin-bottom: 2rem;
        }

        .project-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #eee;
            margin-bottom: 1rem;
            overflow: hidden;
            display: block;
        }

        .project-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-item:hover .project-thumbnail img {
            transform: scale(1.05);
        }

        .project-item a {
            text-decoration: none;
            color: inherit;
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 500;
            color: #1a1a1a;
            line-height: 1.2;
            margin-top: 1rem;
            display: block;
        }

        @media (max-width: 768px) {
            .work-page-content {
                padding: 2rem;
            }
            .project-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .project-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="/site/" style="text-decoration: none; color: inherit;">ALL GROUP DESIGN AND RESEARCH</a>
        </div>
        <nav>
            <a href="/site/work.html">Work</a>
            <a href="/site/about.html">About</a>
            <a href="/site/lab.html">Lab</a>
            <a href="/site/contact.html">Contact</a>
        </nav>
    </header>

    <main class="work-page-content">
        <div class="category-group">
            <div class="category-name">Architecture / Interior</div>
            <div class="project-grid">
                <div class="project-item">
                    <a href="/site/work/baan-maria/">
                        <div class="project-thumbnail">
                            <img src="/site/assets/images/work/baan-maria/image_1.jpg" alt="Baan Maria">
                        </div>
                        <span class="project-title">Baan Maria</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="category-group">
            <div class="category-name">Interior</div>
            <div class="project-grid">
                <div class="project-item">
                    <a href="/site/work/my-name-specialty-coffee/">
                        <div class="project-thumbnail">
                            <img src="/site/assets/images/work/my-name-specialty-coffee/Image_7.png" alt="My Name Specialty Coffee">
                        </div>
                        <span class="project-title">My Name Specialty Coffee</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-left">© 2026 ALL GROUP DESIGN AND RESEARCH</div>
        <div class="footer-right">Designed by Neo</div>
    </footer>

</body>
</html>
