<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>Work – ALL GROUP DESIGN AND RESEARCH</title>
    <link rel="stylesheet" href="/site/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .work-page-content {
            padding: 5rem;
            max-width: 1400px;
        }

        .category-group {
            margin-bottom: 4rem;
        }

        .category-name {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .project-list {
            list-style: none;
        }

        .project-item {
            margin-bottom: 0.5rem;
        }

        .project-item a {
            font-size: 2.2rem;
            font-weight: 500;
            color: #1a1a1a;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-block;
            line-height: 1.2;
        }

        .project-item a:hover {
            color: #666;
        }

        @media (max-width: 768px) {
            .work-page-content {
                padding: 2rem;
            }
            .project-item a {
                font-size: 1.6rem;
            }
        }

            </div>
